<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบจองคิวถ่ายภาพ</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family:'Kanit',sans-serif; background:#0f0f10; color:#eee; margin:0; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#1c1c1f; padding:20px; border-radius:15px; margin-bottom:20px; }

input,textarea {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:white;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  cursor:pointer;
}

.job-image {
  max-width:200px;
  border-radius:10px;
  margin-top:10px;
}

.status {
  padding:5px 10px;
  border-radius:8px;
}
.done { background:#28a745; }
.pending { background:#dc3545; }

.details-box {
  margin-top:10px;
  padding:10px;
  background:#111;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1 style="text-align:center;">📸 ระบบจองคิวถ่ายภาพ</h1>

<div class="card">
<input id="name" placeholder="ชื่อ - นามสกุล">
<input id="type" placeholder="งานเกี่ยวกับอะไร">
<input id="schedule" type="date">
<textarea id="details" placeholder="รายละเอียด"></textarea>
<input id="contact" placeholder="Line / เบอร์">
<input id="image" type="file" accept="image/*">
<img id="preview" style="display:none;max-width:200px;">
<button onclick="submitForm()">ส่งข้อมูล</button>
</div>

<div class="card">
<div id="list"></div>
</div>

</div>

<script type="module">

// 🔥 Firebase v9
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// ✅ config ของคุณ
const firebaseConfig = {
  apiKey: "AIzaSyCeL5H8w_mragqjZMLWX2fwLXDkZN7leh8",
  authDomain: "longlens-e9d2d.firebaseapp.com",
  projectId: "longlens-e9d2d",
  storageBucket: "longlens-e9d2d.firebasestorage.app",
  messagingSenderId: "105761350491",
  appId: "1:105761350491:web:9f98ab62dcc0143555707e",
  measurementId: "G-1NJ6S0D2HF"
};

// init
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

let imageBase64 = "";

// preview รูป
document.getElementById("image").onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ()=>{
    imageBase64 = reader.result;
    preview.src = reader.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
};

// ส่งข้อมูล
window.submitForm = async function(){
  await addDoc(collection(db,"jobs"),{
    name: name.value,
    type: type.value,
    schedule: schedule.value,
    details: details.value,
    contact: contact.value,
    image: imageBase64,
    status: "pending"
  });

  alert("ส่งสำเร็จแล้ว");
};

// โหลดข้อมูล realtime
onSnapshot(collection(db,"jobs"), snapshot=>{
  list.innerHTML = "";

  snapshot.forEach(doc=>{
    const job = doc.data();

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${job.name}</b><br>
      ${job.type}<br>
      ${job.schedule}<br>
      ${job.contact}<br>

      ${job.image ? `<img src="${job.image}" class="job-image">` : ""}

      <button onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'">
        📄 ดูรายละเอียด
      </button>

      <div class="details-box" style="display:none;">
        ${job.details || "-"}
      </div>

      <div style="margin-top:10px;">
        <span class="status ${job.status==='done'?'done':'pending'}">
          ${job.status==='done'?'เสร็จแล้ว':'กำลังทำ'}
        </span>
      </div>
    `;

    list.appendChild(div);
  });

});

</script>

</body>
</html>
